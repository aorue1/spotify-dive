<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

<script>
const D=__PAYLOAD__;
const YRS=[];for(let y=2013;y<=2026;y++)YRS.push(String(y));
const MN=['','JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const PAL=['#00ff41','#ffb000','#41d9ff','#ff5252','#e8b3ff','#ffe93d','#ff8c3d','#4a9eff','#ff5ea8','#e8ffe8'];
const S={tab:'overview',q:'',style:'',label:'',country:'',artist:'',y0:2013,y1:2026,
 trMode:'s',trAbs:false,thenA:2018,thenB:2022,nowA:2025,nowB:2026,
 rdMin:5,rdBefore:2024,rdPeak:'',rdSort:'score',matchSet:null,
 sortT:'h',sortDir:-1,digMin:2};
// Excel-style filters: each dimension holds a SET of chosen values plus a mode.
// mode 'in'  -> keep rows matching any chosen value
// mode 'out' -> keep rows matching none of them (this is what a plain <select>
//               could never express, and the reason for the rewrite)
const DIMS=['genre','style','label','artist','country'];
const SEL={},MODE={};DIMS.forEach(d=>{SEL[d]=new Set();MODE[d]='in';});
function selPass(dim,vals){const set=SEL[dim];if(!set.size)return true;
 const hit=vals.some(v=>v!=null&&set.has(v));return MODE[dim]==='in'?hit:!hit;}
const ALIAS={'uk':'GB','usa':'US','us':'US','russia':'RU','ussr':'RU','czech republic':'CZ','czechia':'CZ',
'holland':'NL','south korea':'KR','korea':'KR','taiwan':'TW','vietnam':'VN','iran':'IR','syria':'SY',
'venezuela':'VE','bolivia':'BO','tanzania':'TZ','moldova':'MD','macedonia':'MK','north macedonia':'MK',
'yugoslavia':'RS','serbia':'RS','bosnia & herzegovina':'BA','trinidad & tobago':'TT','uae':'AE',
'ivory coast':'CI','cape verde':'CV','democratic republic of the congo':'CD','republic of the congo':'CG',
'laos':'LA','brunei':'BN','myanmar':'MM','burma':'MM','palestine':'PS','kosovo':'RS','scotland':'GB','england':'GB','wales':'GB'};
const I2N={};for(const[n,i]of Object.entries(D.N2I)){if(!I2N[i])I2N[i]=n.replace(/\b\w/g,c=>c.toUpperCase());}
const isoCache={};
function isoOf(c){if(!c)return null;if(c in isoCache)return isoCache[c];
 let s=c.split('&')[0].split(',')[0].trim().toLowerCase();
 const r=D.N2I[s]||ALIAS[s]||null;isoCache[c]=r;return r;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function jsq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function fmtH(h){return h>=10?Math.round(h)+' h':h>=1?h.toFixed(1)+' h':Math.round(h*60)+' min';}
const metaOf=a=>D.META[a]||null;
function labelOf(t){return t.lb||((metaOf(t.a)||{}).l||[])[0]||null;}
function countryOf(a){const m=metaOf(a);return m?isoOf(m.c):null;}
function aStyles(a){const m=metaOf(a);return (m&&m.s)||[];}
function aGenres(a){const m=metaOf(a);return (m&&m.g)||[];}
// genre lives on the RELEASE; fall back to the artist profile only when the
// release hasn't been resolved yet. Both return LISTS - many-to-many by design.
function tStyles(t){return (t.rs&&t.rs.length)?t.rs:aStyles(t.a);}
function tGenres(t){return (t.rg&&t.rg.length)?t.rg:aGenres(t.a);}
// union across an artist's tracks, for artist-level views
const _agS={},_agG={};
function stylesOf(a){if(_agS[a])return _agS[a];const c={};
 D.T.forEach(t=>{if(t.a===a)tStyles(t).forEach(x=>c[x]=(c[x]||0)+t.h);});
 return _agS[a]=Object.entries(c).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);}
function genresOf(a){if(_agG[a])return _agG[a];const c={};
 D.T.forEach(t=>{if(t.a===a)tGenres(t).forEach(x=>c[x]=(c[x]||0)+t.h);});
 return _agG[a]=Object.entries(c).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);}
function artistPass(a,skip){return true;}   // superseded by selPass
function trackPass(t){
 if(!selPass('artist',[t.a]))return false;
 if(!selPass('genre',tGenres(t)))return false;
 if(!selPass('style',tStyles(t)))return false;
 if(!selPass('label',[labelOf(t)]))return false;
 if(!selPass('country',[countryOf(t.a)]))return false;
 let wp=0;for(const[y,p]of Object.entries(t.y))if(+y>=S.y0&&+y<=S.y1)wp+=p;
 if(!wp)return false;
 if(S.q){const s=(t.n+' '+t.a+' '+t.al).toLowerCase();if(!s.includes(S.q))return false;}
 return true;}
// same as trackPass but ignoring ONE dimension, so a chart of that dimension
// still shows every value rather than only the selected ones
function trackPassExcept(t,skip){
 for(const d of DIMS){ if(d===skip) continue;
  const v=d==='artist'?[t.a]:d==='genre'?tGenres(t):d==='style'?tStyles(t)
        :d==='label'?[labelOf(t)]:[countryOf(t.a)];
  if(!selPass(d,v))return false;}
 let wp=0;for(const[y,p]of Object.entries(t.y))if(+y>=S.y0&&+y<=S.y1)wp+=p;
 if(!wp)return false;
 if(S.q){const s=(t.n+' '+t.a+' '+t.al).toLowerCase();if(!s.includes(S.q))return false;}
 return true;}
function winPlays(t){let wp=0;for(const[y,p]of Object.entries(t.y))if(+y>=S.y0&&+y<=S.y1)wp+=p;return wp;}
function winHours(t){return t.h*winPlays(t)/t.p;}
function artistWinH(a){const info=D.A[a];if(!info)return 0;let h=0;
 for(const[y,v]of Object.entries(info.y))if(+y>=S.y0&&+y<=S.y1)h+=v;return h;}
function filteredTracks(){return D.T.filter(trackPass);}
// ---------- charts ----------
const IC={zoom:1,sl:-1,baseW:900};
function areaChart(labels,vals,h){
 const n=vals.length;if(!n)return '';
 const W=Math.round(IC.baseW*IC.zoom);
 const L=38,R=14,T=16,B=30;
 const max=Math.max(1,...vals);
 const px=i=>L+(n===1?(W-L-R)/2:i/(n-1)*(W-L-R));
 const py=v=>h-B-v/max*(h-T-B);
 const pts=vals.map((v,i)=>px(i).toFixed(1)+','+py(v).toFixed(1)).join(' ');
 const ma=vals.map((_,i)=>{let s=0,c=0;for(let j=i-3;j<=i+3;j++)if(j>=0&&j<n){s+=vals[j];c++;}return s/c;});
 const mpts=ma.map((v,i)=>px(i).toFixed(1)+','+py(v).toFixed(1)).join(' ');
 const step=Math.max(1,Math.ceil(n/Math.max(1,(W-L-R)/74)));

function matFor(kind){const m={};
 if(kind==='g'||kind==='s'){
  for(const t of D.T){
   if(!trackPassExcept(t,KIND2DIM[kind]))continue;
   let keys=kind==='g'?tGenres(t):tStyles(t);
   if(!keys.length)keys=['(untagged)'];   // otherwise these hours vanish from the chart
   for(const k of keys){const row=m[k]??={};
    for(const[y,p]of Object.entries(t.y)){if(+y>=S.y0&&+y<=S.y1)row[y]=(row[y]||0)+t.h*p/t.p/keys.length;}}}
  return m;}
 if(kind==='l'){
  for(const t of D.T){
   if(!trackPassExcept(t,'label'))continue;
   const k=labelOf(t);if(!k)continue;
   const row=m[k]??={};
   for(const[y,p]of Object.entries(t.y)){if(+y>=S.y0&&+y<=S.y1)row[y]=(row[y]||0)+t.h*p/t.p;}}
  return m;}
 for(const[a,info]of Object.entries(D.A)){
  const me=metaOf(a);if(!me)continue;
  if(!D.T.some(t=>t.a===a&&trackPassExcept(t,KIND2DIM[kind]||'country')))continue;
  let keys=kind==='c'?[me.c?(I2N[isoOf(me.c)]||me.c.split('&')[0].split(',')[0].trim()):null].filter(Boolean):
   kind==='g'?genresOf(a):kind==='s'?stylesOf(a):(me.l||[]);
  if(!keys.length)continue;
  for(const k of keys){const row=m[k]??={};
   for(const[y,h]of Object.entries(info.y)){if(+y>=S.y0&&+y<=S.y1)row[y]=(row[y]||0)+h/keys.length;}}}
 return m;}
function topStylesFor(years){const c={};
 for(const t of D.T){const st=tStyles(t);if(!st.length)continue;
  let p=0;for(const y of years)p+=t.y[y]||0;if(!p)continue;
  const h=t.h*p/t.p;

function recArtists(){

   <div><b>open</b> <a class="pa" href="spotify:track:${t.id}">app ↗</a> · <a class="pa" href="https://open.spotify.com/track/${t.id}" target="_blank">web ↗</a></div>
   </div>
  </div></div>
 <div class="pk-sec"><h4>your history</h4><div class="pk-stat">
  <div><span>${t.p}</span><small>plays</small></div>
  <div><span>${t.h.toFixed(1)}</span><small>hours</small></div>
  <div><span>${Math.round(t.sk/t.p*100)}%</span><small>skipped</small></div>
  <div><span>${t.f.slice(2)}</span><small>first heard</small></div>
 </div>
 <div style="margin-top:10px">${sparkYears(t.y)} <span class="mut" style="font-size:10px">${t.f} → ${t.l}</span></div></div>
 <div class="pk-sec"><h4>player</h4>
  <iframe style="border-radius:6px" src="https://open.spotify.com/embed/track/${t.id}" width="100%" height="80"
   frameborder="0" loading="lazy" allow="encrypted-media"></iframe></div>
 ${sib.length>1?`<div class="pk-sec"><h4>also from “${esc(t.al)}” <span class="mut" style="text-transform:none;letter-spacing:0">· ${alP} plays · ${alH.toFixed(1)} h</span></h4>
  ${sib.map(x=>`<div class="pk-sib" onclick="peek('${x.id}')"><span>${x.id===t.id?'▸ ':''}${esc(x.n)}</span><span class="mut">${x.p}× · ${x.h.toFixed(1)}h</span></div>`).join('')}</div>`:''}
 <div class="pk-sec"><h4>lyrics</h4><div id="pkLyr" class="mut">loading…</div></div>`;
 p.style.display='block';p.scrollTop=0;document.getElementById('peekBg').style.display='block';updateRe();
 // artwork via Spotify oEmbed (no auth)
 const setArt=u=>{const el=document.getElementById('pkArt');if(el&&u)el.src=u;};
 if(OE[t.id])setArt(OE[t.id]);
 else fetch(`https://open.spotify.com/oembed?url=spotify:track:${t.id}`).then(r=>r.json())
   .then(j=>{OE[t.id]=j.thumbnail_url;setArt(j.thumbnail_url);}).catch(()=>{});
 // lyrics via LRCLIB (no auth)
 const box=()=>document.getElementById('pkLyr');
 const key=t.a+'|'+t.n;
 const strip=x=>x.replace(/\s*[\(\[].*?[\)\]]/g,'').replace(/\s*-\s*(original|radio|extended|club|dub|vocal|instrumental|remix|edit|mix|version).*$/i,'').trim();
 if(LY[key]!==undefined){if(box())box().textContent=LY[key]||'no lyrics found (instrumental or not in LRCLIB)';}
 else fetch('https://lrclib.net/api/get?'+new URLSearchParams({artist_name:strip(t.a),track_name:strip(t.n)}))
   .then(r=>r.ok?r.json():null)
   .then(j=>{const l=j&&(j.plainLyrics||'');LY[key]=l;if(box())box().textContent=l||'no lyrics found (instrumental or not in LRCLIB)';})
   .catch(()=>{if(box())box().textContent='lyrics lookup failed';});
};

// ---------- init ----------
(function(){
 const allH=Object.values(D.A).reduce((s,a)=>s+a.h,0);
 document.getElementById('hdrHours').textContent=Math.round(allH).toLocaleString();
 // populate filter selects
 // ---- build the Excel-style multiselect filters ----
 const opts={genre:{},style:{},label:{},artist:{},country:{}};
 for(const t of D.T){
  tGenres(t).forEach(g=>opts.genre[g]=(opts.genre[g]||0)+t.h);
  tStyles(t).forEach(x=>opts.style[x]=(opts.style[x]||0)+t.h);
  const l=labelOf(t);if(l)opts.label[l]=(opts.label[l]||0)+t.h;
  opts.artist[t.a]=(opts.artist[t.a]||0)+t.h;
  const c=countryOf(t.a);if(c)opts.country[c]=(opts.country[c]||0)+t.h;}
 const OPTS={};DIMS.forEach(d=>{OPTS[d]=Object.entries(opts[d])
   .sort((a,b)=>selLabelFor(d,a[0]).localeCompare(selLabelFor(d,b[0]),undefined,{sensitivity:'base'}));});
 window.OPTS=OPTS;
 const PLACE={genre:'genre',style:'subgenre',label:'label',artist:'artist',country:'country'};

 window.msRefresh=d=>{
  const btn=document.querySelector(`#ms_${d} .msBtn`);if(!btn)return;
  const n=SEL[d].size;
  btn.textContent=n===0?PLACE[d]+'…'
    :(MODE[d]==='out'?'not ':'')+(n===1?selLabelFor(d,[...SEL[d]][0]):n+' '+PLACE[d]+'s');
  btn.className='msBtn'+(n?(MODE[d]==='out'?' out':' on'):'');
  const i=document.createElement('i');i.textContent='▾';btn.appendChild(i);};

 window.msRender=d=>{
  const q=(document.getElementById('msq_'+d)||{}).value||'';
  const ql=q.toLowerCase();
  const list=OPTS[d].filter(([v])=>selLabelFor(d,v).toLowerCase().includes(ql));
  document.getElementById('mslist_'+d).innerHTML=list.slice(0,600).map(([v,h])=>
   `<label class="msItem"><input type="checkbox" ${SEL[d].has(v)?'checked':''}
     onchange="toggleSel('${jsq(d)}','${jsq(v)}')"><span class="n">${esc(selLabelFor(d,v))}</span>
     <span class="h">${fmtH(h)}</span></label>`).join('')
   ||'<div class="note" style="margin:4px">no matches</div>';};

 window.msOpen=d=>{
  document.querySelectorAll('.msPanel').forEach(p=>{if(p.id!=='mspanel_'+d)p.classList.remove('open');});
  const p=document.getElementById('mspanel_'+d);p.classList.toggle('open');
  if(p.classList.contains('open')){msRender(d);const f=document.getElementById('msq_'+d);f&&f.focus();}};
 window.msMode=(d,m)=>{MODE[d]=m;sync();
   document.getElementById('mspanel_'+d).classList.add('open');msRender(d);
   document.querySelectorAll(`#mspanel_${d} .seg span`).forEach(el=>el.classList.toggle('on',el.dataset.m===m));};
 window.msAll=d=>{const q=((document.getElementById('msq_'+d)||{}).value||'').toLowerCase();
   OPTS[d].filter(([v])=>selLabelFor(d,v).toLowerCase().includes(q)).forEach(([v])=>SEL[d].add(v));
   sync();document.getElementById('mspanel_'+d).classList.add('open');msRender(d);};
 window.msNone=d=>{SEL[d].clear();sync();
   document.getElementById('mspanel_'+d).classList.add('open');msRender(d);};

 DIMS.forEach(d=>{
  document.getElementById('ms_'+d).innerHTML=
   `<button class="msBtn" onclick="msOpen('${d}')"></button>
    <div class="msPanel" id="mspanel_${d}">
      <input type="text" id="msq_${d}" placeholder="search ${PLACE[d]}…" oninput="msRender('${d}')">
      <div class="msTools">
        <button onclick="msAll('${d}')">all</button>
        <button onclick="msNone('${d}')">none</button>
        <span class="seg"><span data-m="in" class="on" onclick="msMode('${d}','in')">INCLUDE</span><span data-m="out" onclick="msMode('${d}','out')">EXCLUDE</span></span>
      </div>
      <div class="msList" id="mslist_${d}"></div>
    </div>`;
  msRefresh(d);});
 document.addEventListener('click',e=>{
   if(!e.target.closest('.msWrap'))document.querySelectorAll('.msPanel').forEach(p=>p.classList.remove('open'));});

 const y0=document.getElementById('selY0'),y1=document.getElementById('selY1');
 YRS.forEach(y=>{y0.add(new Option(y,y));y1.add(new Option(y,y));});
 y0.value='2013';y1.value='2026';
 y0.onchange=()=>{S.y0=+y0.value;if(S.y1<S.y0){S.y1=S.y0;y1.value=y0.value;}render();};
 y1.onchange=()=>{S.y1=+y1.value;if(S.y1<S.y0){S.y0=S.y1;y0.value=y1.value;}render();};
 let deb;document.getElementById('q').oninput=e=>{clearTimeout(deb);deb=setTimeout(()=>{S.q=e.target.value.toLowerCase().trim();render();},160);};
 render();
})();
</script></body></html>
